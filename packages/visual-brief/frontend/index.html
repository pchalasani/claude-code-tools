<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>visual brief — dev harness</title>
  </head>
  <body>
    <!--
      Dev-only harness for `npm run dev`. The shipped page is generated by the
      Python renderer, which emits the same two elements: a mount point and an
      application/json blob holding the validated document.
    -->
    <div id="visual-brief-root"></div>
    <script type="application/json" id="visual-brief-document">
      {
        "title": "Dev harness",
        "summary": "Local sample document for frontend development only.",
        "updates": [
          {
            "id": "dev-update",
            "timestamp": "2026-07-25T19:00:00Z",
            "headline": "Dev update",
            "summary": "One lane, one item.",
            "lanes": [
              {
                "id": "what-changed",
                "name": "What changed",
                "items": [
                  {
                    "id": "sample",
                    "glance": "Sample item",
                    "explanation": "Replaced by the real interface later.",
                    "trust": "reported-by-agent"
                  }
                ]
              }
            ]
          }
        ]
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
