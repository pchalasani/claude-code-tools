<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>visual brief — dev harness</title>
    <script>
      (() => {
        const variants = {
          "north-window": ["north-window", "light", false],
          "blue-margin": ["blue-margin", "light", true],
          "dusk-margin": ["blue-margin", "dark", true],
          "solarized-paper": ["blue-margin", "light", true],
          "solarized-slate": ["blue-margin", "dark", true],
          "catppuccin-latte": ["blue-margin", "light", true],
          "catppuccin-mocha": ["blue-margin", "dark", true],
          "dusk-ledger": ["dusk-ledger", "dark", false],
          "night-ledger": ["night-ledger", "dark", false],
        };
        const root = document.documentElement;
        const requested = new URLSearchParams(location.search).get("design");
        const design = Object.hasOwn(variants, requested)
          ? requested
          : "catppuccin-mocha";
        const [family, mode, paired] = variants[design];
        root.dataset.design = design;
        root.dataset.designFamily = family;
        root.dataset.designMode = mode;
        root.dataset.designPaired = String(paired);
      })();
    </script>
  </head>
  <body>
    <!--
      Dev-only harness for `npm run dev`. The shipped page is generated by the
      Python renderer, which emits the same two elements: a mount point and an
      application/json blob holding the validated document.
    -->
    <div id="visual-brief-root"></div>
    <script type="application/json" id="visual-brief-document">
      {
        "title": "Dev harness",
        "summary": "Local sample document for frontend development only.",
        "updates": [
          {
            "id": "dev-update",
            "timestamp": "2026-07-25T19:00:00Z",
            "headline": "Dev update",
            "summary": "One lane, one item.",
            "lanes": [
              {
                "id": "what-changed",
                "name": "What changed",
                "items": [
                  {
                    "id": "sample",
                    "glance": "Sample item",
                    "explanation": "Replaced by the real interface later.",
                    "trust": "reported-by-agent"
                  }
                ]
              }
            ]
          }
        ]
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
